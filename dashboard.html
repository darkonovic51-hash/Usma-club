<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم USMA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* Variables */
:root{--red:#C8102E;--black:#08090B;--b2:#121417;--b3:#1a1d22;--navy:#101A2B;--gold:#B79A62;--white:#F5F5F3;--muted:#9a9ea6;--line:rgba(183,154,98,.22);--r:6px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Cairo',Tahoma,sans-serif;background:var(--black);color:var(--white);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* Layout */
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:#000;border-inline-end:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px;font-weight:900}
.brand img{height:42px}.brand small{display:block;color:var(--gold);font-size:.7rem;letter-spacing:.12em}
.nav-g{color:var(--gold);font-size:.72rem;letter-spacing:.12em;margin:14px 10px 4px}
.nav-b{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;background:none;border-radius:var(--r);text-align:start;font-weight:600;color:#ddd;transition:.2s;font-size:.92rem}
.nav-b:hover{background:var(--b3)}.nav-b.on{background:var(--red);color:#fff}
.nav-b .bd{margin-inline-start:auto;background:var(--gold);color:#000;border-radius:100px;font-size:.7rem;padding:0 8px;font-weight:900}
main{padding:24px clamp(14px,3vw,36px);min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:1.7rem;font-weight:900}.top h1::after{content:"";display:block;width:60px;height:3px;background:linear-gradient(90deg,var(--red),var(--gold));margin-top:6px}
.btn{display:inline-block;padding:10px 20px;border-radius:var(--r);font-weight:800;background:var(--b3);border:1px solid var(--line);transition:.2s;text-align:center}
.btn:hover{border-color:var(--gold)}.btn.red{background:var(--red);border-color:var(--red)}.btn.red:hover{box-shadow:0 0 20px rgba(200,16,46,.5)}
.btn.s{padding:5px 14px;font-size:.85rem}.btn.d{color:#ff6b7f}.btn:disabled{opacity:.5;cursor:wait}
.btn.mv{padding:5px 10px;font-size:.85rem}
.card{background:var(--b2);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.banner{background:#2a0c13;border:1px solid var(--red);border-radius:var(--r);padding:14px 18px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}.f.full{grid-column:1/-1}
.f label.lb{font-size:.82rem;color:var(--gold);font-weight:700}
.f input:not([type=checkbox]):not([type=hidden]),.f select,.f textarea{background:#0b0c0e;border:1px solid #2b2f36;border-radius:var(--r);padding:10px 12px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--red);outline:0}
.f textarea{min-height:100px;resize:vertical}.f input[type=checkbox]{width:22px;height:22px;accent-color:var(--red)}
/* Image picker */
.img-f{display:flex;gap:12px;align-items:center;background:#0b0c0e;border:1px dashed var(--gold);border-radius:var(--r);padding:10px}
.img-f .pv{width:84px;height:84px;flex-shrink:0;border-radius:var(--r);overflow:hidden;background:repeating-linear-gradient(45deg,#14171b,#14171b 8px,#101215 8px,#101215 16px);display:grid;place-items:center;font-size:1.8rem;border:1px solid var(--line)}
.img-f .pv img{width:100%;height:100%;object-fit:cover}
.img-f .ia{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.img-f .hint{flex-basis:100%}
.hint{color:var(--muted);font-size:.75rem}
/* Gallery */
.gal-f{display:flex;flex-wrap:wrap;gap:10px;background:#0b0c0e;border:1px dashed var(--gold);border-radius:var(--r);padding:10px}
.gal-f .gi{position:relative;width:88px;height:88px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.gal-f .gi img{width:100%;height:100%;object-fit:cover}
.gal-f .gx{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.8);color:#fff;font-size:.8rem}
.gal-f .gx:hover{background:var(--red)}
.gal-f .gadd{width:88px;height:88px;display:grid;place-items:center;border:1px dashed var(--gold);border-radius:var(--r);color:var(--gold);font-size:1.8rem;cursor:pointer}
.gal-f .gadd:hover{background:var(--red);color:#fff;border-color:var(--red)}
/* People editor (لاعبو التشكيلة التاريخية) */
.pp-row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));padding:10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:#0b0c0e}
.pp-row .img-f{grid-column:1/-1}
.pp-row input,.pp-row select{background:#121417;border:1px solid #2b2f36;border-radius:var(--r);padding:8px 10px;width:100%}
/* STARTING XI + Season stats editors */
.xi-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.xi-top select{background:#0b0c0e;border:1px solid #2b2f36;border-radius:var(--r);padding:8px 14px;font-weight:800;width:auto;max-width:100%}
.xi-cnt{background:#0b0c0e;border:1px solid var(--line);padding:4px 16px;border-radius:100px;font-weight:900}
.xi-cnt.ok{border-color:#3ddc84;color:#3ddc84}
.xi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;margin-top:10px}
.xc{position:relative;border:1px solid var(--line);border-radius:var(--r);background:#0b0c0e;overflow:hidden;transition:.2s}
.xc:hover{border-color:var(--gold)}
.xc.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 18px rgba(200,16,46,.4)}
.xc .xt{display:block;width:100%;text-align:start;background:none;padding:0}
.xc .xim{aspect-ratio:3/4;background:repeating-linear-gradient(45deg,#14171b,#14171b 8px,#101215 8px,#101215 16px);display:grid;place-items:center;font-size:1.6rem;overflow:hidden;position:relative}
.xc .xim img{width:100%;height:100%;object-fit:cover;object-position:top}
.xc .xn{position:absolute;top:4px;inset-inline-start:7px;font-weight:900;font-size:1.3rem;color:transparent;-webkit-text-stroke:1px var(--gold)}
.xc .xnm{padding:6px 8px 4px;font-weight:800;font-size:.82rem;line-height:1.3;overflow-wrap:anywhere}
.xc .xps{padding:0 8px 6px;color:var(--muted);font-size:.7rem}
.xc .tick{position:absolute;top:6px;inset-inline-end:6px;background:var(--red);border-radius:50%;width:24px;height:24px;display:none;place-items:center;font-size:.8rem;font-weight:900}
.xc.sel .tick{display:grid}
.xc select{display:block;margin:0 6px 8px;width:calc(100% - 12px);background:#121417;border:1px solid var(--gold);border-radius:var(--r);padding:5px 6px;font-size:.75rem}
.xc select.miss{border-color:#ff6b7f}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:560px;background:var(--b2)}
th{background:#000;color:var(--gold);font-size:.8rem;padding:11px 10px;text-align:start}
td{padding:9px 10px;border-top:1px solid rgba(255,255,255,.06);font-size:.9rem;vertical-align:middle}
tr:hover td{background:var(--b3)}td img{width:38px;height:38px;object-fit:cover;border-radius:4px}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
/* Modal + toast + login + migration */
.md{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.md.on{display:flex}
.mb{background:var(--b2);border:1px solid var(--gold);border-top:4px solid var(--red);border-radius:var(--r);width:min(780px,100%);max-height:92vh;overflow:auto;padding:24px}
.mb h3{margin-bottom:16px;font-size:1.3rem}.mf{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;inset-inline-start:20px;background:#000;border:1px solid var(--gold);border-inline-start:4px solid var(--red);padding:12px 18px;border-radius:var(--r);z-index:99;display:none;max-width:90vw}
#mig{position:fixed;inset:0;z-index:90;background:rgba(8,9,11,.92);display:none;place-items:center;text-align:center;padding:20px}
#mig b{display:block;font-size:1.3rem;margin-bottom:8px;color:var(--gold)}
#login{position:fixed;inset:0;z-index:80;background:var(--black) radial-gradient(ellipse at top,rgba(200,16,46,.3),transparent 60%);display:none;place-items:center;padding:16px}
#login form{width:min(400px,100%);background:var(--b2);border:1px solid var(--gold);border-top:4px solid var(--red);padding:28px;border-radius:var(--r);display:grid;gap:14px;text-align:center}
#login img{height:80px;margin:0 auto}
#lerr{color:#ff6b7f;min-height:1.3em}
.mob{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:fixed;inset-block:0;inset-inline-start:0;width:270px;z-index:40;transform:translateX(100%);transition:.3s}aside.on{transform:none}.mob{display:inline-block}}
</style>
</head>
<body>

<!-- LOGIN — Firebase Authentication (بريد + كلمة سر) -->
<div id="login"><form id="lf">
  <img src="https://raw.githubusercontent.com/darkonovic51-hash/Usma-club/7c0dc5e27e968bef9e32f6eddc4c5d0e4db1603c/1000025944-removebg-preview.png" alt="USMA">
  <h2>لوحة تحكم USMA</h2>
  <div class="f"><label class="lb" for="em">البريد الإلكتروني</label><input id="em" type="email" required autocomplete="username"></div>
  <div class="f"><label class="lb" for="cd">كلمة السر</label><input id="cd" type="password" required autocomplete="current-password"></div>
  <button class="btn red">دخول</button><div id="lerr" role="alert"></div><a href="index.html" class="hint">← العودة للموقع</a>
</form></div>

<div id="mig" role="status"><div><b id="migT">جارٍ نقل محتوى الموقع الحالي…</b><span class="hint" id="migS">يتم قراءة ما هو معروض الآن في الصفحة الرئيسية وربطه بلوحة التحكم دون أي تغيير في المحتوى</span></div></div>

<div class="app" id="app" hidden>
  <aside id="side"><div class="brand"><img src="https://raw.githubusercontent.com/darkonovic51-hash/Usma-club/7c0dc5e27e968bef9e32f6eddc4c5d0e4db1603c/1000025944-removebg-preview.png" alt=""><div>USM ALGER<small>DASHBOARD</small></div></div><nav id="nav" aria-label="الأقسام"></nav></aside>
  <main><div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn mob" id="menuB" aria-label="القائمة">☰</button><h1 id="ttl"></h1></div><div id="topActs" style="display:flex;gap:8px;flex-wrap:wrap"></div></div><div id="banner"></div><div id="view"></div></main>
</div>
<div class="md" id="md"><div class="mb" id="mb" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
/* ================= CONFIG ================= */
const CFG = {
  DB: "https://academy-school-16d1b-default-rtdb.firebaseio.com", // Realtime Database
  ROOT: "usma",                                                    // كل بيانات الموقع تحت /usma فقط
  API_KEY: "ضع_المفتاح_هنا",                  // Web API Key: Firebase Console ← Project settings ← General (مفتاح عام وليس سرًّا)
  BUCKET: "academy-school-16d1b.appspot.com"  // Firebase Storage (إن كان مشروعك أحدث فقد يكون academy-school-16d1b.firebasestorage.app).
                                              // الصور تُرفع إلى Storage أولًا؛ وإن تعذّر الرفع (القواعد/الاسم) تُحفظ مضغوطة داخل القاعدة تلقائيًا.
};

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const getP=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setP=(o,p,v)=>{const k=p.split(".");k.slice(0,-1).reduce((a,x)=>a[x]??(a[x]={}),o)[k.at(-1)]=v;};
const deleteP=(o,p)=>{const k=p.split("."),t=k.slice(0,-1).reduce((a,x)=>a?.[x],o);if(t)delete t[k.at(-1)];};
const clone=v=>JSON.parse(JSON.stringify(v));
let DB={}, cur=null;
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",4500);}

/* ================= AUTH — Firebase Authentication (بريد + كلمة سر عبر REST) ================= */
let TOK=sessionStorage.getItem("usmaTok")||"", RTK=sessionStorage.getItem("usmaRtk")||"", EXP=+sessionStorage.getItem("usmaExp")||0;
function saveTok(id,rt,exp){
  TOK=id; RTK=rt; EXP=Date.now()+(+exp-60)*1000;
  sessionStorage.setItem("usmaTok",TOK); sessionStorage.setItem("usmaRtk",RTK); sessionStorage.setItem("usmaExp",EXP);
}
async function signIn(email,pw){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${CFG.API_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password:pw,returnSecureToken:true})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error?.message||"AUTH");
  saveTok(d.idToken,d.refreshToken,d.expiresIn);
}
async function freshToken(){
  if(!TOK) throw new Error("غير مسجّل الدخول");
  if(Date.now()<EXP) return TOK;
  const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${CFG.API_KEY}`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(RTK)}`});
  const d=await r.json(); if(!r.ok){ logout(); throw new Error("انتهت الجلسة"); }
  saveTok(d.id_token,d.refresh_token,d.expires_in); return TOK;
}
const AUTH_ERR={INVALID_LOGIN_CREDENTIALS:"البريد أو كلمة السر غير صحيحة",INVALID_PASSWORD:"كلمة السر غير صحيحة",EMAIL_NOT_FOUND:"البريد غير مسجّل",TOO_MANY_ATTEMPTS_TRY_LATER:"محاولات كثيرة، حاول لاحقًا",USER_DISABLED:"الحساب معطّل",INVALID_EMAIL:"صيغة البريد غير صحيحة"};
function logout(){ sessionStorage.clear(); location.href="index.html"; }

async function api(p,m="GET",b){
  const t=await freshToken();
  const r=await fetch(`${CFG.DB}/${CFG.ROOT}${p?"/"+p:""}.json?auth=${t}`,{method:m,body:b===undefined?undefined:JSON.stringify(b)});
  if(!r.ok)throw new Error(r.status===401||r.status===403?"غير مصرح — تأكد أن بريدك هو المكتوب في قواعد Firebase":"خطأ "+r.status);
  return r.json();
}
$("#lf").addEventListener("submit",async e=>{
  e.preventDefault(); const b=e.submitter; b.disabled=true; $("#lerr").textContent="";
  try{
    if(CFG.API_KEY.startsWith("ضع")) throw new Error("ضع Web API Key في CFG.API_KEY داخل الملف");
    await signIn($("#em").value.trim(),$("#cd").value);
    await api("ticketBookings");                      // اختبار: لا يقرؤها إلا حساب المدير المسموح في القواعد
    start();
  }catch(er){
    const m=String(er.message||er); TOK="";RTK="";EXP=0; sessionStorage.clear();
    $("#lerr").textContent=/غير مصرح/.test(m)?"هذا الحساب غير مصرّح له بإدارة الموقع":(AUTH_ERR[m.split(" ")[0]]||m);
    $("#cd").value="";
  }
  b.disabled=false;
});

/* ================= FORMATIONS (نفس تعريفات index.html — يجب أن تبقى متطابقة) ================= */
const POS_AR={GK:"حارس مرمى",LB:"ظهير أيسر",RB:"ظهير أيمن",CB:"قلب دفاع",LWB:"ظهير جناح أيسر",RWB:"ظهير جناح أيمن",DM:"وسط مدافع",CM:"وسط",AM:"صانع ألعاب",LM:"وسط أيسر",RM:"وسط أيمن",LW:"جناح أيسر",RW:"جناح أيمن",ST:"مهاجم"};
const FORMATIONS={
  "4-3-3":[["GK"],["LB","CB","CB","RB"],["CM","CM"],["DM"],["LW","ST","RW"]],
  "4-2-3-1":[["GK"],["LB","CB","CB","RB"],["DM","DM"],["LW","AM","RW"],["ST"]],
  "4-4-2":[["GK"],["LB","CB","CB","RB"],["LM","CM","CM","RM"],["ST","ST"]],
  "4-1-4-1":[["GK"],["LB","CB","CB","RB"],["DM"],["LM","CM","CM","RM"],["ST"]],
  "3-4-3":[["GK"],["CB","CB","CB"],["LM","CM","CM","RM"],["LW","ST","RW"]],
  "3-5-2":[["GK"],["CB","CB","CB"],["LWB","CM","DM","CM","RWB"],["ST","ST"]],
  "5-3-2":[["GK"],["LWB","CB","CB","CB","RWB"],["CM","CM","CM"],["ST","ST"]]
};
function slotsOf(f){
  const cnt={}, out=[];
  (FORMATIONS[f]||[]).forEach((row,ri)=>row.forEach(pos=>{ cnt[pos]=(cnt[pos]||0)+1; out.push({id:pos+cnt[pos],pos,row:ri}); }));
  return out;
}

/* ================= SCHEMA (كل عنصر في الصفحة الرئيسية له قسم إدارة هنا) ================= */
// حقل: [المسار, التسمية, النوع, خيارات]
// الأنواع: text number date datetime textarea lines image gallery people xi sstats select(مصفوفة أو دالة) check goals
const CATS=[["goalkeepers","حراس المرمى"],["defenders","المدافعون"],["midfielders","لاعبو الوسط"],["forwards","المهاجمون"],["coach","المدرب"]];
const ACATS=[["photo","صور"],["article","مقالات"],["document","وثائق"],["historic-match","مباريات تاريخية"],["trophy","بطولات"],["squad","تشكيلات تاريخية"],["legend","شخصيات"],["event","أحداث تاريخية"]];
const TABS=[["","(بدون)"],["fx","النتائج والرزنامة"],["st","الترتيب"]];
const SOC=["Facebook","Instagram","YouTube","X"];
const VIS=["visible","ظاهر في الموقع","check",{def:true}], ORD=["order","الترتيب","number"];
const byOrder=(a,b)=>(a.order??0)-(b.order??0);
const SEASON_OPTS=()=>[["","(الموسم الحالي / بدون تحديد)"],...arr("seasons").sort(byOrder).map(s=>[s.id||s._k,s.name])];
const TEAM_OPTS=()=>[["","— بدون ربط (الاسم المكتوب فقط) —"],...arr("standings").map(t=>[t.id||t._k,t.team])];
/* نصوص الصفحة الرئيسية (homepageSettings): المفتاح يطابق data-ht في index.html */
const HT_FIELDS=[["servicesKicker","الخدمات — العنوان الصغير"],["servicesTitle","الخدمات — العنوان"],["teamKicker","الفريق الأول — العنوان الصغير"],["teamTitle","الفريق الأول — العنوان"],
  ["fixturesTitle","المباريات والترتيب — العنوان"],["tabFixtures","تبويب «النتائج والرزنامة»"],["tabStandings","تبويب «الترتيب»"],
  ["ticketsKicker","التذاكر — العنوان الصغير"],["ticketsTitle","التذاكر — العنوان"],["offersTitle","عنوان قسم الاشتراكات والبطاقات"],
  ["storeKicker","المتجر — العنوان الصغير"],["storeTitle","المتجر — العنوان"],["academyKicker","مدرسة كرة القدم — العنوان الصغير"],["academyFormTitle","عنوان نموذج التسجيل في المدرسة"],
  ["newsKicker","الأخبار — العنوان الصغير"],["newsTitle","الأخبار — العنوان"],

/* ================= IMAGE UPLOAD (رفع مباشر من الجهاز: Storage ثم القاعدة كاحتياط) ================= */
function fileToData(file,max=1000){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const png=/png|webp|gif|svg/.test(file.type);
      let m=png?Math.min(max,600):max, out;
      for(let i=0;i<6;i++){
        const k=Math.min(1,m/Math.max(img.width,img.height)), w=Math.max(1,Math.round(img.width*k)), h=Math.max(1,Math.round(img.height*k));
        const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
        if(!png){x.fillStyle="#fff";x.fillRect(0,0,w,h);}
        x.drawImage(img,0,0,w,h);
        out=c.toDataURL(png?"image/png":"image/jpeg",.82);
        if(out.length<650000||m<=300)break;
        m=Math.round(m*.75);
      }
      res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("الملف ليس صورة صالحة"));};
    img.src=url;
  });
}
let storageOK=true;
async function uploadStorage(file){
  const name=`usma/${Date.now()}-${file.name.replace(/[^\w.-]/g,"_")}`;
  const r=await fetch(`https://firebasestorage.googleapis.com/v0/b/${CFG.BUCKET}/o?name=${encodeURIComponent(name)}`,{method:"POST",headers:{"Content-Type":file.type,"Authorization":"Firebase "+await freshToken()},body:file});
  const d=await r.json(); if(!r.ok)throw new Error("storage");
  return`https://firebasestorage.googleapis.com/v0/b/${CFG.BUCKET}/o/${encodeURIComponent(d.name)}?alt=media&token=${d.downloadTokens}`;
}
async function pickImage(file,max){
  if(!file.type.startsWith("image/"))throw new Error("اختر ملف صورة فقط");
  if(storageOK&&CFG.BUCKET){ try{ return await uploadStorage(file); }catch(_){ storageOK=false; toast("تعذّر الرفع إلى Firebase Storage — تُحفظ الصور مضغوطة داخل القاعدة (راجع اسم الـbucket وقواعد Storage)"); } }
  return fileToData(file,max);
}

function fieldHTML([n,l,t="text",o],val){
  const id="x_"+n.replace(/\W/g,"_");
  const full=(["textarea","goals","lines","image","gallery","people","xi","sstats"].includes(t)||(o&&o.full))?" full":"";
  let v=val, inp;
  if(t==="goals")v=(val||[]).map(g=>`${g.scorer}|${g.minute}|${g.team}`).join("\n");
  if(t==="lines")v=Array.isArray(val)?val.map(x=>x&&typeof x==="object"?`${x.player||""}${x.minute?"|"+x.minute:""}`:x).join("\n"):(val&&typeof val==="object"?Object.values(val).join("\n"):(val??""));
  if(t==="text"&&Array.isArray(v))v=v.join("، ");
  v=v??"";
  if(t==="xi")return`<div class="f full"><label class="lb">${esc(l)}</label><div id="xiEd"></div></div>`;
  if(t==="sstats")return`<div class="f full"><label class="lb">${esc(l)}</label><div id="ssBox"></div></div>`;
  if(t==="textarea"||t==="goals"||t==="lines")inp=`<textarea id="${id}" name="${n}" data-t="${t}">${esc(v)}</textarea>`;
  else if(t==="select"){const opts=typeof o==="function"?o():o;inp=`<select id="${id}" name="${n}" data-t="select">${opts.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}" ${a==v?"selected":""}>${esc(b)}</option>`}).join("")}</select>`;}
  else if(t==="check"){const on=(val===undefined||val===null)?!!(o&&o.def):!!val;inp=`<input id="${id}" type="checkbox" name="${n}" data-t="check" ${on?"checked":""}>`;}
  else if(t==="image"){const max=(o&&o.max)||1000;return`<div class="f${full}"><label class="lb">${esc(l)}</label><div class="img-f" data-if="${id}" data-n="${esc(n)}" data-max="${max}">${imgInner(id,n,v,max)}</div></div>`;}
  else if(t==="gallery"){const max=(o&&o.max)||1400,a=Array.isArray(val)?val:(val&&typeof val==="object"?Object.values(val):(val?String(val).split("\n").filter(Boolean):[]));return`<div class="f${full}"><label class="lb">${esc(l)}</label><div data-gf="${id}" data-n="${esc(n)}" data-max="${max}">${galInner(id,n,a,max)}</div></div>`;}
  else if(t==="people"){const a=Array.isArray(val)?val:Object.values(val||{});return`<div class="f${full}"><label class="lb">${esc(l)}</label><div data-people="${esc(n)}">${a.map(pplRow).join("")}</div><button type="button" class="btn s" data-ppadd>＋ إضافة لاعب</button></div>`;}
  else if(t==="datetime")inp=`<input id="${id}" type="datetime-local" name="${n}" data-t="datetime" value="${esc(String(v).slice(0,16))}">`;
  else inp=`<input id="${id}" type="${t==="number"?"number":t==="date"?"date":"text"}" ${t==="number"?'step="any"':""} name="${n}" data-t="${t}" value="${esc(v)}">`;
  return`<div class="f${full}"><label class="lb" for="${id}">${esc(l)}</label>${inp}</div>`;
}
/* ترجع الكائن بعد التحقق — وترمي Error عند وجود تشكيلة أساسية غير صالحة */
function collect(form,fields,base){
  const o=structuredClone(base||{});
  fields.forEach(([n,,t="text"])=>{
    let v;
    if(t==="xi"){
      const sel=Object.entries(XI.sel);
      if(sel.length===0){ delete o.startingXI; delete o.formation; return; }
      if(sel.length!==11) throw new Error(`التشكيلة الأساسية يجب أن تضم 11 لاعبًا بالضبط (المحدد الآن: ${sel.length})`);
      if(sel.some(([,s])=>!s)) throw new Error("حدّد مركز كل لاعب مختار في التشكيلة الأساسية");
      const slots=slotsOf(XI.formation), ids=slots.map(s=>s.id);
      if(new Set(sel.map(([,s])=>s)).size!==11) throw new Error("لا يمكن وضع لاعبين في خانة المركز نفسها");
      o.formation=XI.formation;
      o.startingXI=sel.sort((a,b)=>ids.indexOf(a[1])-ids.indexOf(b[1])).map(([playerId,slot])=>({playerId,slot,position:slots.find(s=>s.id===slot).pos}));
      return;
    }
    if(t==="sstats"){
      ssRead();
      const g=SS.data[""]||{}; if(Object.keys(g).length) o.stats=g; else delete o.stats;
      const ss={}; Object.entries(SS.data).forEach(([k,x])=>{ if(k&&Object.keys(x).length) ss[k]=x; });
      if(Object.keys(ss).length) o.seasonStats=ss; else delete o.seasonStats;
      return;
    }
    if(t==="people"){
      v=[...form.querySelectorAll(`[data-people="${n}"] .pp-row`)].map(r=>({
        name:r.querySelector(".pp-name").value.trim(),category:r.querySelector(".pp-cat").value,
        position:r.querySelector(".pp-pos").value.trim(),number:r.querySelector(".pp-num").value.trim(),
        image:r.querySelector("input[type=hidden]").value})).filter(p=>p.name);
    }else{
      const el=form.elements[n]; if(!el)return;
      if(t==="check")v=el.checked;
      else if(t==="number")v=el.value===""?null:Number(el.value);
      else if(t==="datetime")v=el.value?el.value+":00+01:00":"";
      else if(t==="goals")v=el.value.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const[a,b,c]=s.split("|");return{scorer:(a||"").trim(),minute:(b||"").trim(),team:(c||"home").trim()==="away"?"away":"home"}});
      else if(t==="lines")v=el.value.split("\n").map(s=>s.trim()).filter(Boolean);
      else if(t==="gallery"){try{v=JSON.parse(el.value||"[]");}catch(_){v=[];}}
      else v=el.value.trim();
    }
    if(v===null)deleteP(o,n);else setP(o,n,v);
  });
  return o;
}

/* =====================================================================
   نقل المحتوى الحالي للموقع إلى Firebase (مرة واحدة، دون تغيير المحتوى)
   - يفتح index.html في إطار مخفي، وينتظر اكتمال تحميله، ويقرأ siteData = ما هو معروض فعليًا الآن
   - يكتب في القاعدة فقط الأقسام غير الموجودة فيها (لا يستبدل ولا يحذف أي بيانات موجودة)
   - ثم يضع meta/migrated = true؛ بعدها تصبح القاعدة هي المصدر الوحيد للموقع
   ===================================================================== */
let MIGFAIL=null;
function migUI(on,t,s){ const m=$("#mig"); m.style.display=on?"grid":"none"; if(t)$("#migT").textContent=t; if(s)$("#migS").textContent=s; }
function loadIndexContent(){
  return new Promise((res,rej)=>{
    const f=document.createElement("iframe"); f.src="index.html";
    f.style.cssText="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px";
    const t0=Date.now(); let iv;
    const fail=e=>{ clearInterval(iv); f.remove(); rej(e); };
    f.onload=()=>{
      iv=setInterval(()=>{
        try{
          const w=f.contentWindow;
          if(w.USMA_READY){ clearInterval(iv); const s=JSON.parse(w.eval("JSON.stringify(siteData)")); f.remove(); res(s); }
          else if(Date.now()-t0>25000) fail(new Error("انتهت مهلة تحميل index.html"));
        }catch(e){ fail(e); }
      },300);
    };
    f.onerror=()=>fail(new Error("تعذّر فتح index.html"));
    document.body.appendChild(f);
  });
}
const pad=n=>String(n).padStart(3,"0");
function keyed(a,pre,{forceKey=false,order=true}={}){
  const o={};
  (a||[]).forEach((x,i)=>{
    let k=(!forceKey&&x.id&&/^[\w-]+$/.test(String(x.id)))?String(x.id):pre+pad(i+1);
    if(o[k]) k=pre+pad(i+1)+"x"+i;
    o[k]={...clone(x),id:k};
    if(order&&(o[k].order===undefined||o[k].order===null)) o[k].order=i+1;
  });
  return o;
}
function deepFill(dst,src){            // يضيف المفاتيح الناقصة فقط ولا يغيّر الموجود
  let changed=false;
  Object.keys(src||{}).forEach(k=>{
    if(dst[k]===undefined||dst[k]===null){ dst[k]=clone(src[k]); changed=true; }
    else if(src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k])&&typeof dst[k]==="object"&&!Array.isArray(dst[k])){ if(deepFill(dst[k],src[k])) changed=true; }
  });
  return changed;
}
function buildPatch(S,root){
  const P={}, has=p=>getP(root,p.replace(/\//g,"."))!=null;
  const A=S.archive||{};
  const list=(path,a,pre,opt)=>{ if(!has(path)&&a&&a.length) P[path]=keyed(a,pre,opt); };
  const single=(path,src)=>{ if(!src)return; const c=getP(root,path.replace(/\//g,".")); if(c==null){ P[path]=clone(src); } else { const m=clone(c); if(deepFill(m,src)) P[path]=m; } };
  /* الفرق أولًا (لربط المباريات والمباراة القادمة بها بالمعرّف) */
  list("standings",S.standings,"st",{forceKey:true,order:false});
  const tid={}; Object.entries(P.standings||getP(root,"standings")||{}).forEach(([k,t])=>{ if(t&&t.team) tid[String(t.team).trim().toLowerCase()]=t.id||k; });
  const link=n=>tid[String(n||"").trim().toLowerCase()]||"";
  single("siteSettings",S.siteSettings); single("homepageSettings",S.homepage); single("hero",S.hero);
  single("fixturesConfig",S.fixturesConfig); single("academy",S.academy); single("tickets/match",S.tickets&&S.tickets.match);
  const nm=clone(S.nextMatch||{}); if(nm.home&&link(nm.home.name)) nm.home.teamId=link(nm.home.name); if(nm.away&&link(nm.away.name)) nm.away.teamId=link(nm.away.name);
  single("nextMatch",nm);
  list("navigation",S.navigation,"nv"); list("services",S.services,"sv"); list("tickets/offers",S.tickets&&S.tickets.offers,"of");
  list("players",S.players,"pl");
  list("matches",(S.matches||[]).map(m=>({...m,homeTeamId:m.homeTeamId||link(m.homeTeam)||undefined,awayTeamId:m.awayTeamId||link(m.awayTeam)||undefined})),"m");
  list("products",S.products,"pr"); list("news",S.news,"n");
  single("archiveSettings",A.settings);
  list("archiveItems",A.items,"ai"); list("archiveTimeline",A.timeline,"tl"); list("clubHistory",A.history,"ch");
  list("historicMatches",A.matches,"hm"); list("trophies",A.trophies,"tr"); list("historicSquads",A.squads,"sq");
  list("clubLegends",A.legends,"lg"); list("archiveDocuments",A.documents,"dc"); list("clubStats",A.stats,"cs");
  return P;
}
async function migrate(){
  MIGFAIL=null;
  let meta; try{ meta=await api("meta"); }catch(e){ MIGFAIL="تعذّر الاتصال بقاعدة البيانات: "+e.message; return; }
  if(meta&&meta.migrated) return;                                  // نُقل المحتوى سابقًا
  migUI(true,"جارٍ نقل محتوى الموقع الحالي…","قراءة ما هو معروض الآن في الصفحة الرئيسية وربطه بلوحة التحكم دون أي تغيير في المحتوى");
  try{
    const S=await loadIndexContent();
    const root=(await api(""))||{};
    const patch=buildPatch(S,root), n=Object.keys(patch).length;
    patch["meta/migrated"]=true;
    await api("","PATCH",patch);
    migUI(false);
    toast(n?`تم نقل المحتوى الحالي للموقع إلى لوحة التحكم (${n} قسم) دون أي تغيير`:"المحتوى الحالي موجود بالفعل في القاعدة");
  }catch(e){
    migUI(false);
    MIGFAIL="تعذّر نقل محتوى الموقع الحالي تلقائيًا ("+(e.message||e)+"). افتح اللوحة من نفس الاستضافة التي يوجد عليها index.html (مثل GitHub Pages) وليس من ملف محلي، وتأكد أن قواعد Firebase تسمح للمدير بالكتابة على usma.";
  }
}
function showBanner(){
  $("#banner").innerHTML=MIGFAIL?`<div class="banner"><span>⚠ ${esc(MIGFAIL)}</span><button class="btn s red" id="retryMig">إعادة المحاولة</button></div>`:"";
}
document.addEventListener("click",async e=>{ if(e.target.id==="retryMig"){ await migrate(); showBanner(); if(!MIGFAIL) show(cur||"hero"); } });

/* ================= VIEWS ================= */
const secOf=id=>SECTIONS.find(s=>s.id===id);
function buildNav(){
  $("#nav").innerHTML=SECTIONS.map(s=>s.g?`<div class="nav-g">${s.g}</div>`:`<button class="nav-b" data-s="${s.id}">${s.label}${s.kind==="inbox"?`<span class="bd" id="bd-${s.id}" hidden></span>`:""}</button>`).join("")+`<div class="nav-g">النظام</div><a class="nav-b" href="index.html" target="_blank" rel="noopener">↗ عرض الموقع</a><button class="nav-b" id="lo">تسجيل الخروج</button>`;
  $("#lo").onclick=logout;
}
async function load(path){const v=await api(path);setP(DB,path.replace(/\//g,"."),v);return v;}
async function badges(){
  await Promise.all(INBOXES.map(async s=>{
    try{await load(s.path);}catch(_){}
    const n=arr(s.path).filter(x=>x.status==="pending").length,b=$("#bd-"+s.id);
    if(b){b.hidden=!n;b.textContent=n;}
  }));
}
async function loadNeeds(s){ for(const n of s.needs||[]){ try{await load(n);}catch(_){} } }
async function show(id){
  cur=id;const s=secOf(id);$("#ttl").textContent=s.label;$("#side").classList.remove("on");
  document.querySelectorAll(".nav-b").forEach(b=>b.classList.toggle("on",b.dataset.s===id));
  showBanner();
  $("#view").innerHTML=`<div class="empty">⏳ جارٍ التحميل…</div>`;
  try{await load(s.path);}catch(e){toast(e.message);}
  await loadNeeds(s);
  $("#topActs").innerHTML=s.kind==="list"?`<button class="btn red" id="addB">＋ إضافة</button>`:"";
  if(s.kind==="single")single(s);else if(s.kind==="list"){list(s);$("#addB").onclick=()=>editItem(s);}else inbox(s);
}
function single(s){
  const data=get(s.path)||{};
  $("#view").onclick=null;$("#view").onchange=null;
  $("#view").innerHTML=`<form class="card" id="sf"><div class="fgrid">${s.fields.map(f=>fieldHTML(f,getP(data,f[0]))).join("")}</div><div class="mf"><button class="btn red">حفظ التغييرات</button></div></form>`;
  $("#sf").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await api(s.path,"PUT",collect(e.target,s.fields,data));toast("تم الحفظ ✓ (يظهر في الموقع فورًا)");await load(s.path);}catch(er){toast(er.message);}b.disabled=false;};
}
function cell(x,c){
  const v=x[c];
  if(c==="image"||c==="logo")return v?`<img src="${esc(v)}" alt="">`:"—";
  if(c==="visible")return v===false?"🚫 مخفي":"ظاهر";
  if(c==="formation"){const n=(Array.isArray(x.startingXI)?x.startingXI:Object.values(x.startingXI||{})).length;return n===11?`✓ ${esc(x.formation||"")}`:"—";}
  if(c==="seasonId"){const f=arr("seasons").find(z=>(z.id||z._k)===v);return esc(f?f.name:"—");}
  if(c==="date"||c==="createdAt")return v?esc(String(v).slice(0,16).replace("T"," ")):"—";
  if(c==="category"){const f=CATS.find(k=>k[0]===v)||ACATS.find(k=>k[0]===v);return esc(f?f[1]:v??"—");}
  if(typeof v==="boolean")return v?"✓":"—";
  return esc(Array.isArray(v)?v.join("، "):(v??"—"));
}
const isManual=rows=>rows.length>0&&rows.every(r=>r.order!==undefined&&r.order!==null&&r.order!=="");
function list(s){
  let rows=arr(s.path); rows.sort(s.sort||byOrder);
  const isSt=s.id==="standings", manual=isSt&&isManual(rows), mv=s.orderable||manual;
  $("#view").onchange=null;
  const banner=isSt&&rows.length?`<div class="card" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>ترتيب الفرق في الموقع: <b>${manual?"يدوي (بأزرار ▲▼)":"تلقائي (حسب النقاط ثم فارق الأهداف)"}</b></span>${manual?`<button class="btn s" data-st-auto>العودة للترتيب التلقائي</button>`:`<button class="btn s" data-st-manual>تفعيل الترتيب اليدوي</button>`}</div>`:"";
  $("#view").innerHTML=banner+(s.hint?`<p class="hint" style="margin-bottom:10px">${s.hint}</p>`:"")+(rows.length?`<div class="tw"><table><thead><tr>${s.cols.map(c=>`<th>${LBL[c]||c}</th>`).join("")}<th></th></tr></thead><tbody>${rows.map(x=>`<tr>${s.cols.map(c=>`<td>${cell(x,c)}</td>`).join("")}<td><div class="acts">${mv?`<button class="btn mv" data-mv="up:${x._k}" aria-label="رفع">▲</button><button class="btn mv" data-mv="down:${x._k}" aria-label="خفض">▼</button>`:""}<button class="btn s" data-e="${x._k}">تعديل</button><button class="btn s d" data-x="${x._k}">حذف</button></div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">لا توجد عناصر في هذا القسم — اضغط «إضافة» لإنشاء أول عنصر.</div>`);
  $("#view").onclick=async e=>{
    const t=e.target, k=t.dataset.e, x=t.dataset.x, m=t.dataset.mv;
    try{
      if(k)editItem(s,rows.find(r=>r._k===k));
      else if(x){ if(confirm("هل تريد الحذف نهائيًا؟ لا يمكن التراجع.")){ await api(`${s.path}/${x}`,"DELETE"); toast("تم الحذف"); show(cur); } }
      else if(m){
        const [dir,key]=m.split(":"), i=rows.findIndex(r=>r._k===key), j=i+(dir==="up"?-1:1); if(j<0||j>=rows.length)return;
        const ord=rows.map((_,n)=>n+1); [ord[i],ord[j]]=[ord[j],ord[i]];
        const p={}; rows.forEach((r,n)=>p[r._k+"/order"]=ord[n]);
        await api(s.path,"PATCH",p); show(cur);
      }
      else if(t.dataset.stManual!==undefined){ const p={}; rows.forEach((r,n)=>p[r._k+"/order"]=n+1); await api(s.path,"PATCH",p); toast("تم تفعيل الترتيب اليدوي"); show(cur); }
      else if(t.dataset.stAuto!==undefined){ const p={}; rows.forEach(r=>p[r._k+"/order"]=null); await api(s.path,"PATCH",p); toast("عاد الترتيب التلقائي"); show(cur); }
    }catch(er){toast(er.message);}
  };
}
async function editItem(s,item){
  const it=item||{};
  await loadNeeds(s);
  const hasXI=s.fields.some(f=>f[2]==="xi"), hasSS=s.fields.some(f=>f[2]==="sstats");
  if(hasXI){ try{await load("players");}catch(_){} }
  openM(`<h3>${item?"تعديل":"إضافة"} — ${s.label}</h3><form id="ef"><div class="fgrid">${s.fields.map(f=>fieldHTML(f,it[f[0]])).join("")}</div><div class="mf"><button type="button" class="btn" data-c>إلغاء</button><button class="btn red">حفظ</button></div></form>`);
  if(hasXI){ xiInit(it); xiRender(); }
  if(hasSS){ ssInit(it); ssRender(); }
  $("#ef").onsubmit=async e=>{
    e.preventDefault();const b=e.submitter;b.disabled=true;
    try{
      const k=it._k||uid(),base={...it};delete base._k;
      const o=collect(e.target,s.fields,base);o.id=k;
      if(s.zero) s.zero.forEach(f=>o[f]=o[f]??0);
      if(s.pre) s.pre(o);
      if(s.id==="players"&&!o.details)o.details={};
      if(!item&&(o.order===undefined||o.order===null)&&s.fields.some(f=>f[0]==="order")){
        const rows=arr(s.path), mx=Math.max(0,...rows.map(r=>+r.order||0));
        if(s.id==="standings"){ if(isManual(rows)) o.order=mx+1; } else o.order=mx+1;
      }
      await api(`${s.path}/${k}`,"PUT",o);
      if(s.post) await s.post(o);
      closeM();toast("تم الحفظ ✓ (يظهر في الموقع فورًا)");show(cur);
    }catch(er){toast(er.message);b.disabled=false;}
  };
}
const ST=[["pending","قيد الانتظار"],["confirmed","مؤكد"],["completed","مكتمل"],["cancelled","ملغى"]];
function inbox(s){
  const rows=arr(s.path).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  $("#view").innerHTML=rows.length?`<div class="tw"><table><thead><tr>${s.cols.map(c=>`<th>${LBL[c]||c}</th>`).join("")}<th>الحالة</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr>${s.cols.map(c=>`<td>${cell(x,c)}</td>`).join("")}<td><select data-st="${x._k}" aria-label="الحالة">${ST.map(([v,l])=>`<option value="${v}" ${x.status===v?"selected":""}>${l}</option>`).join("")}</select></td><td><button class="btn s d" data-x="${x._k}">حذف</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">لا توجد طلبات واردة بعد.</div>`;
  $("#view").onchange=async e=>{const k=e.target.dataset.st;if(!k)return;try{await api(`${s.path}/${k}/status`,"PUT",e.target.value);toast("تم تحديث الحالة ✓");badges();}catch(er){toast(er.message);}};
  $("#view").onclick=async e=>{const x=e.target.dataset.x;if(x&&confirm("حذف هذا الطلب نهائيًا؟")){try{await api(`${s.path}/${x}`,"DELETE");show(cur);badges();}catch(er){toast(er.message);}}};
}
function openM(h){$("#mb").innerHTML=h;$("#md").classList.add("on");}
function closeM(){$("#md").classList.remove("on");}
$("#md").addEventListener("click",e=>{if(e.target.id==="md"||e.target.dataset.c!==undefined)closeM();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM();});
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(b)show(b.dataset.s);});
$("#menuB").onclick=()=>$("#side").classList.toggle("on");

/* ================= START ================= */
async function start(){
  $("#login").style.display="none";$("#app").hidden=false;buildNav();
  await migrate();                 // ينقل محتوى الموقع الحالي تلقائيًا مرة واحدة (لا بيانات افتراضية جديدة)
  show("hero");badges();
}
if(TOK) start().catch(()=>{ $("#app").hidden=true; $("#login").style.display="grid"; });
else{ $("#login").style.display="grid"; $("#em").focus(); }
</script>
</body>
</html>
